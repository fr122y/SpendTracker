name: Protected paths

# Runs on `pull_request_target` so that this workflow, the scripts, and the path
# list are always taken from the base branch and cannot be edited by the pull
# request under check. Never check out or execute pull request head code here.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  protected-paths:
    name: protected-paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the check script
        run: node --test .github/scripts/protected-paths.test.mjs

      - name: Check changed files against protected paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/protected-paths.mjs

  test-integrity:
    name: test-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the check script
        run: node --test .github/scripts/test-integrity.test.mjs

      - name: Check that existing tests are not weakened
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/test-integrity.mjs

  change-trailer:
    name: change-trailer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the check script
        run: node --test .github/scripts/change-trailer.test.mjs

      - name: Check that commits name the OpenSpec changes they touch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/change-trailer.mjs
