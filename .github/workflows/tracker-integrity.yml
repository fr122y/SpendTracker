name: Tracker Integrity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-task-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate task tracker
        run: python3 scripts/validate_task_tracker.py
