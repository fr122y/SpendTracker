name: DB Migration

on:
  workflow_dispatch:
    inputs:
      run_backfill_keywords:
        description: 'Run keyword mappings backfill after migration'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      expected_pending_migrations:
        description: 'Exact pending migration filenames, or none for a metadata-only preflight'
        required: true
        type: string
      preflight_only:
        description: 'Inspect migration ledger and schema without applying migrations'
        required: false
        default: false
        type: boolean

concurrency:
  group: db-migration-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require an expected migration list
        if: ${{ github.event.inputs.expected_pending_migrations == '' }}
        run: |
          echo "expected_pending_migrations is required for every migration run"
          exit 1

      - name: Validate expected migration state
        if: ${{ github.event.inputs.expected_pending_migrations != '' }}
        env:
          EXPECTED_PENDING_MIGRATIONS: ${{ github.event.inputs.expected_pending_migrations }}
          DB_MIGRATION_PREFLIGHT_ONLY: ${{ github.event.inputs.preflight_only }}
        run: node scripts/db-migration-preflight.mjs

      - name: Run DB migrations
        if: ${{ github.event.inputs.preflight_only != 'true' }}
        run: npm run db:migrate

      - name: Run keyword backfill
        if: ${{ github.event.inputs.preflight_only != 'true' && github.event.inputs.run_backfill_keywords == 'true' }}
        run: npm run db:backfill:keywords
