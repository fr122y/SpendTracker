name: E2E Preview

# Runs the Playwright suite against the Vercel Preview deployment of a commit.
# Vercel reports each deployment as a GitHub Deployment; this workflow starts on
# its `deployment_status` event, so the run and its `e2e` check belong to the
# deployed commit, which for a Pull Request is the head commit.
#
# The workflow file and the tests come from the deployed commit, not from the
# default branch, and the job holds the e2e secrets. Pull Request code therefore
# runs with those secrets: keep them limited to the Preview bypass secret and
# a disposable test account on the development database. Never add production
# credentials here.
on:
  deployment_status:

permissions:
  contents: read
  pull-requests: read

# The suite writes to the development database under one test account, so only
# one run executes at a time across all Pull Requests. In-progress runs are
# never cancelled; a run for a commit that is no longer its Pull Request's head
# exits early instead.
#
# Limitation: GitHub keeps at most one pending run per concurrency group. When
# a run is in progress and two more arrive, the newer one cancels the older
# pending run, even if it belongs to another Pull Request. That Pull Request's
# `e2e` check then shows as cancelled and needs a re-run.
concurrency:
  group: e2e-preview
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e
    # Production deployments never reach this job; the guard step below
    # re-checks the environment before anything runs.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
      DEPLOYMENT_IS_PRODUCTION: ${{ github.event.deployment.production_environment }}
      DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
      PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
    steps:
      - name: Require a Vercel Preview deployment
        run: |
          if [ "$DEPLOYMENT_ENVIRONMENT" != "Preview" ] || [ "$DEPLOYMENT_IS_PRODUCTION" = "true" ]; then
            echo "::error::Deployment environment is '$DEPLOYMENT_ENVIRONMENT'; e2e runs only against Vercel Preview."
            exit 1
          fi
          case "$PLAYWRIGHT_BASE_URL" in
            https://*.vercel.app) ;;
            *)
              echo "::error::Deployment URL '$PLAYWRIGHT_BASE_URL' is not a vercel.app Preview URL."
              exit 1
              ;;
          esac
          echo "Testing $PLAYWRIGHT_BASE_URL ($DEPLOYMENT_ENVIRONMENT, $DEPLOYMENT_SHA)"

      - name: Require e2e secrets
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          missing=0
          for name in E2E_USER_EMAIL E2E_USER_PASSWORD VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          exit "$missing"

      - name: Skip a superseded commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOYMENT_SHA/pulls" \
            --jq '[.[] | select(.state == "open") | .head.sha] | join(" ")')
          current=true
          if [ -n "$heads" ]; then
            current=false
            for sha in $heads; do
              [ "$sha" = "$DEPLOYMENT_SHA" ] && current=true
            done
          fi
          if [ "$current" = "false" ]; then
            echo "::notice::$DEPLOYMENT_SHA is no longer the head of its Pull Request; a newer deployment will be tested."
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Check out deployed commit
        if: steps.head.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false

      - name: Read gated spec files
        if: steps.head.outputs.current == 'true'
        id: specs
        run: |
          specs=$(grep -Ev '^[[:space:]]*(#|$)' .github/e2e-specs.txt | tr -d '\r' || true)
          if [ -z "$specs" ]; then
            echo "::error::.github/e2e-specs.txt lists no spec files."
            exit 1
          fi
          missing=0
          for spec in $specs; do
            if [ ! -f "$spec" ]; then
              echo "::error::Spec file $spec listed in .github/e2e-specs.txt does not exist."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "files=$(echo $specs)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.head.outputs.current == 'true'
        run: npm ci

      - name: Read Playwright version
        if: steps.head.outputs.current == 'true'
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.head.outputs.current == 'true'
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.head.outputs.current == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.head.outputs.current == 'true' && steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run e2e tests
        if: steps.head.outputs.current == 'true'
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
          SPEC_FILES: ${{ steps.specs.outputs.files }}
        # SPEC_FILES is split on spaces on purpose: one argument per spec file.
        run: npx playwright test $SPEC_FILES --project=chromium --reporter=list,html,json

      - name: Fail on skipped tests
        if: steps.head.outputs.current == 'true'
        run: |
          skipped=$(node -p "require('./e2e-results.json').stats.skipped")
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped e2e tests were skipped; every gated test must run against the Preview."
            exit 1
          fi

      - name: Upload Playwright report
        if: failure() && steps.head.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.deployment.sha }}
          path: |
            playwright-report/
            e2e-results.json
          retention-days: 7
